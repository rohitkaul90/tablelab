<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Verified — TableLab</title>
  <meta name="description" content="Your TableLab email address has been verified.">
  <meta name="robots" content="noindex">
  <style>
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      background: #111811;
      color: rgba(255,255,255,0.87);
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .check {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #1B5E20;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .check svg { width: 38px; height: 38px; stroke: #fff; }
    h1 { color: #4CAF50; font-size: 1.6rem; margin: 0 0 10px; }
    p { color: rgba(255,255,255,0.72); margin: 0 0 28px; }
    .cta {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 14px 28px;
      background: #2E7D32;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 14px;
    }
    .cta:hover { background: #388E3C; }
    .secondary { color: rgba(255,255,255,0.45); font-size: 0.9rem; text-decoration: none; }
    .secondary:hover { color: rgba(255,255,255,0.7); }
    a.secondary u { text-decoration: none; color: #81C784; }
    .footer {
      margin-top: 40px;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.3);
    }
    .footer a { color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h1>Email verified</h1>
    <p id="subtitle">Your email address is confirmed. You can now sign in to TableLab.</p>

    <a class="cta" id="primaryCta" href="https://tablelab.app">Continue to TableLab</a>
    <a class="secondary" id="secondaryLink" href="https://tablelab.app">or open <u>tablelab.app</u> in your browser</a>

    <div class="footer">
      <a href="https://tablelab.app/privacy">Privacy Policy</a> &nbsp;·&nbsp; © 2026 TableLab
    </div>
  </div>

  <script>
    // On a phone, the primary button deep-links straight into the installed app;
    // on desktop it just opens the web app. The email is already verified
    // server-side by the time this page loads, so signing in works either way.
    (function () {
      var isMobile = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent);
      if (isMobile) {
        var cta = document.getElementById('primaryCta');
        cta.textContent = 'Open the TableLab app';
        cta.href = 'io.supabase.pokertracker://login-callback/';
        document.getElementById('subtitle').textContent =
          'Your email address is confirmed. Open the app and sign in to get started.';
      }
    })();
  </script>
</body>
</html>
