<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="google-site-verification" content="8gHfVqZn4LRbfHV5DT3WXNUbAxu174jD5YxB6UFY0os" />

  <!-- Primary meta -->
  <title>TableLab</title>
  <meta name="description" content="Track your poker sessions, analyze your game with AI coaching, and calculate equity offline. Built for serious cash game and tournament players.">
  <meta name="theme-color" content="#1B5E20">
  <meta name="color-scheme" content="dark">
  <link rel="canonical" href="https://tablelab.app/">

  <!-- Open Graph (Facebook, Reddit, WhatsApp, iMessage) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tablelab.app/">
  <meta property="og:title" content="TableLab">
  <meta property="og:description" content="Track sessions, get AI coaching, calculate equity offline. Built for serious poker players.">
  <meta property="og:image" content="https://tablelab.app/og-cover.png">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:image:alt" content="TableLab — track your poker, fix your leaks. Free bankroll tracker with hand recording, equity calculator, and AI coaching.">
  <meta property="og:site_name" content="TableLab">

  <!-- Twitter/X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TableLab">
  <meta name="twitter:description" content="Track sessions, get AI coaching, calculate equity offline.">
  <meta name="twitter:image" content="https://tablelab.app/og-cover.png">

  <!-- PWA / iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TableLab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Sitewide entity graph (Organization + WebSite). The app below is client-rendered,
       so this static block gives crawlers and AI engines the brand entity without JS. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://tablelab.app/#organization",
        "name": "MagpiQ",
        "url": "https://tablelab.app",
        "sameAs": ["https://magpiq.com", "https://www.youtube.com/channel/UCaslEsv-BMGKuOY4ssKQqVQ"],
        "description": "Independent software studio based in Ontario, Canada — maker of TableLab.",
        "logo": { "@type": "ImageObject", "url": "https://tablelab.app/icons/Icon-512.png", "width": 512, "height": 512 },
        "contactPoint": { "@type": "ContactPoint", "email": "support@tablelab.app", "contactType": "customer support" }
      },
      {
        "@type": "WebSite",
        "@id": "https://tablelab.app/#website",
        "url": "https://tablelab.app",
        "name": "TableLab",
        "publisher": { "@id": "https://tablelab.app/#organization" }
      }
    ]
  }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #111811;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: #111811;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }

    #splash-icon-wrap {
      width: 100px;
      height: 100px;
      background: #1B5E20;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 22px;
    }

    #splash-icon-wrap img {
      width: 68px;
      height: 68px;
      object-fit: contain;
    }

    #splash-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 0.3px;
      margin-bottom: 6px;
    }

    #splash-tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.38);
    }

    /* Indeterminate progress bar at the bottom */
    #splash-bar-track {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(255, 255, 255, 0.06);
      overflow: hidden;
    }

    #splash-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 35%;
      background: #4CAF50;
      border-radius: 1px;
      animation: splash-slide 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes splash-slide {
      0%   { left: -35%; }
      100% { left: 100%; }
    }
  </style>

  <!-- No-JS styling. The splash is position:fixed/z-index:9999 and only fades on the
       'flutter-first-frame' event, which never fires without JS — so it must be hidden
       here or it would cover the <noscript> content in the body. -->
  <noscript>
    <style>
      #splash, #splash-bar-track { display: none !important; }
      .nojs {
        max-width: 60ch;
        margin: 0 auto;
        padding: 48px 22px 64px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #E8EFE6;
        line-height: 1.65;
      }
      .nojs h1 { font-size: 28px; line-height: 1.25; margin-bottom: 14px; }
      .nojs h2 { font-size: 17px; margin: 28px 0 10px; color: #FFFFFF; }
      .nojs p { margin-bottom: 14px; color: #C3CFC0; }
      .nojs ul { margin: 0 0 14px 20px; color: #C3CFC0; }
      .nojs li { margin-bottom: 6px; }
      .nojs a { color: #4CAF50; }
      .nojs .lede { font-size: 17px; color: #E8EFE6; }
      .nojs .note {
        margin-top: 28px; padding: 14px 16px;
        border: 1px solid #2A342B; border-left: 3px solid #4CAF50;
        border-radius: 6px; font-size: 14px; color: #C3CFC0;
      }
      .nojs footer { margin-top: 28px; font-size: 13px; color: #8A968A; }
    </style>
  </noscript>
</head>
<body>
  <!-- Branded splash shown while Flutter initialises -->
  <div id="splash">
    <div id="splash-icon-wrap">
      <img src="icons/Icon-192.png" alt="TableLab">
    </div>
    <div id="splash-title">TableLab</div>
    <div id="splash-tagline">Your edge, quantified.</div>
    <div id="splash-bar-track">
      <div id="splash-bar"></div>
    </div>
  </div>

  <!-- Crawlable fallback. The app above is client-rendered, so without this a non-JS
       crawler (and several AI engines) sees nothing at this URL but a splash screen.
       Mirrors what the app and /about actually offer — keep the two in sync. -->
  <noscript>
    <main class="nojs">
      <h1>TableLab — track your poker, fix your leaks</h1>

      <p class="lede">
        TableLab is a <strong>free poker bankroll tracker and study tool</strong> for cash games and
        tournaments. It records your sessions and hands, turns them into real statistics, and gives
        you AI hand coaching grounded in solver-derived GTO data — so you can find the leak that is
        quietly costing you money, and fix it.
      </p>

      <h2>What you can do with it</h2>
      <ul>
        <li><strong>Track sessions</strong> — cash games and tournaments, live or logged after the fact, in any currency.</li>
        <li><strong>See your real numbers</strong> — win rate, BB/100, ROI, ITM, variance and bankroll over time.</li>
        <li><strong>Record and replay hands</strong> — step through any hand on a visual table.</li>
        <li><strong>Get AI hand coaching</strong> — grounded in a solver-derived GTO frequency library, with an independent equity cross-check.</li>
        <li><strong>Study solved spots</strong> — browse real solver output in the GTO Explorer.</li>
        <li><strong>Run the numbers</strong> — equity, ICM and variance calculators, all free.</li>
        <li><strong>Keep notes on opponents</strong> — player reads with tendency tags.</li>
        <li><strong>Bring your history with you</strong> — import sessions from other poker apps by CSV or Excel.</li>
      </ul>

      <h2>Read more</h2>
      <ul>
        <li><a href="/about">About TableLab — full feature list and FAQ</a></li>
        <li><a href="/blog/">The TableLab blog</a></li>
        <li><a href="/blog/poker-bankroll-management">Poker bankroll management: how many buy-ins you actually need</a></li>
        <li><a href="/blog/can-ai-solve-poker">Can AI solve poker?</a></li>
        <li><a href="/blog/how-to-read-players-without-a-hud">How to read players without a HUD</a></li>
      </ul>

      <h2>Free calculators — no sign-up</h2>
      <ul>
        <li><a href="/variance-calculator">Poker variance &amp; risk-of-ruin calculator</a></li>
        <li><a href="/icm-calculator">ICM calculator</a></li>
      </ul>

      <p class="note">
        <strong>The TableLab app itself needs JavaScript to run.</strong> Enable JavaScript to use it
        in this browser, or get the Android app on
        <a href="https://play.google.com/store/apps/details?id=com.pokertracker.poker_tracker">Google Play</a>.
        The pages linked above are plain HTML and work without it.
      </p>

      <footer>
        TableLab is made by MagpiQ, an independent software studio in Ontario, Canada.
        <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a> ·
        <a href="mailto:support@tablelab.app">support@tablelab.app</a><br>
        Play responsibly. 18+ (19+ in some provinces and states).
      </footer>
    </main>
  </noscript>

  <script>
    // Fade out the HTML splash as soon as Flutter renders its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
