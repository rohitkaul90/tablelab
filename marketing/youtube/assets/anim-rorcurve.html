<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Risk-of-ruin curve — animated (screen-record me)</title>
<style>
  :root { --bg:#111811; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;               /* click anywhere to replay */
    overflow:hidden;
  }
  .stage { width: 1100px; max-width: 94vw; }
  svg { width: 100%; height: auto; display:block; }

  /* Axes + labels fade in first */
  .chrome { opacity:0; animation: fade .40s ease-out forwards; }

  /* The curve draws itself in slowly (stroke reveal). pathLength=1 normalizes it. */
  .curve {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: draw 2.6s cubic-bezier(.35,.05,.25,1) forwards;
    animation-delay: .45s;
  }

  /* Dots pop as the line reaches them (36 BI ~start, 48 BI ~51% along, 56 BI ~end) */
  .dot {
    transform-box: fill-box; transform-origin: center;
    transform: scale(0); opacity:0;
    animation: pop .45s cubic-bezier(.2,1.5,.4,1) forwards;
  }
  .d1 { animation-delay: .55s; }
  .d2 { animation-delay: 1.75s; }
  .d3 { animation-delay: 3.00s; }

  .cap { opacity:0; animation: fade .4s ease-out forwards; animation-delay: 3.2s; }

  @keyframes fade { to { opacity:1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop  { to { transform: scale(1); opacity:1; } }
</style>
</head>
<body onclick="location.reload()">
  <div class="stage">
    <!-- viewBox + geometry identical to the blog SVG; only animation added -->
    <svg viewBox="0 0 560 260" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Risk of ruin falls as bankroll grows: 36 buy-ins gives 5 percent, 48 gives 2 percent, 56 gives 1 percent, for a 3 bb per 100 winner.">
      <text class="chrome" x="20" y="26" fill="#eceff1" font-size="14" font-family="sans-serif">Risk of ruin vs. bankroll (3 bb/100 winner, 85 SD)</text>

      <!-- axes -->
      <g class="chrome">
        <line x1="70" y1="60" x2="70" y2="200" stroke="#455a64" stroke-width="1"/>
        <line x1="70" y1="200" x2="520" y2="200" stroke="#455a64" stroke-width="1"/>
        <text x="60" y="72"  fill="#90a4ae" font-size="11" text-anchor="end" font-family="sans-serif">5%</text>
        <text x="60" y="140" fill="#90a4ae" font-size="11" text-anchor="end" font-family="sans-serif">2%</text>
        <text x="60" y="200" fill="#90a4ae" font-size="11" text-anchor="end" font-family="sans-serif">1%</text>
        <text x="120" y="220" fill="#cfd8dc" font-size="12" text-anchor="middle" font-family="sans-serif">36 BI</text>
        <text x="300" y="220" fill="#cfd8dc" font-size="12" text-anchor="middle" font-family="sans-serif">48 BI</text>
        <text x="480" y="220" fill="#cfd8dc" font-size="12" text-anchor="middle" font-family="sans-serif">56 BI</text>
      </g>

      <!-- curve: (120,68) 5%, (300,140) 2%, (480,192) 1% -->
      <polyline class="curve" pathLength="1" points="120,68 300,140 480,192" fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <circle class="dot d1" cx="120" cy="68"  r="6" fill="#ef9a9a"/>
      <circle class="dot d2" cx="300" cy="140" r="6" fill="#ffd54f"/>
      <circle class="dot d3" cx="480" cy="192" r="6" fill="#4CAF50"/>

      <text class="cap" x="234" y="248" fill="#90a4ae" font-size="11" text-anchor="middle" font-family="sans-serif">More buy-ins &#8594; lower chance of going broke. Source: Primedope.</text>
    </svg>
  </div>
</body>
</html>
