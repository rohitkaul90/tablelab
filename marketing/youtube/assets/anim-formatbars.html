<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Format bars — animated (screen-record me)</title>
<style>
  :root { --bg:#111811; }
  * { margin:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    cursor: pointer;               /* click anywhere to replay */
    overflow:hidden;
  }
  .stage { width: 1100px; max-width: 94vw; }
  svg { width: 100%; height: auto; display:block; }

  /* Bars grow from their LEFT edge (x=150) rightward */
  .bar {
    transform-box: fill-box;
    transform-origin: left center;
    transform: scaleX(0);
    animation: grow .70s cubic-bezier(.2,.85,.25,1) forwards;
  }
  .b1 { animation-delay: .20s; }
  .b2 { animation-delay: .55s; }
  .b3 { animation-delay: .90s; }

  /* Value labels + source fade in after their bar lands */
  .val, .src, .ttl { opacity:0; animation: fade .35s ease-out forwards; }
  .ttl { animation-delay: .05s; }
  .v1  { animation-delay: .80s; }
  .v2  { animation-delay: 1.15s; }
  .v3  { animation-delay: 1.50s; }
  .src { animation-delay: 1.75s; }

  @keyframes grow { to { transform: scaleX(1); } }
  @keyframes fade { to { opacity:1; } }
</style>
</head>
<body onclick="location.reload()">
  <div class="stage">
    <!-- viewBox kept identical to the blog SVG; only animation added -->
    <svg viewBox="0 0 600 240" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-label="Recommended bankroll by format: live cash 20 to 50 buy-ins, online cash 50 to 100, tournaments 100 to 300 or more.">
      <text class="ttl" x="20" y="28" fill="#eceff1" font-size="14" font-family="sans-serif">Typical bankroll by format (buy-ins)</text>
      <line x1="150" y1="50" x2="150" y2="205" stroke="#455a64" stroke-width="1"/>

      <!-- Live cash -->
      <text x="140" y="86" fill="#cfd8dc" font-size="13" text-anchor="end" font-family="sans-serif">Live cash</text>
      <rect class="bar b1" x="150" y="72" width="66" height="26" fill="#4CAF50"/>
      <text class="val v1" x="224" y="90" fill="#eceff1" font-size="12" font-family="sans-serif">20&ndash;50</text>

      <!-- Online cash -->
      <text x="140" y="128" fill="#cfd8dc" font-size="13" text-anchor="end" font-family="sans-serif">Online cash</text>
      <rect class="bar b2" x="150" y="114" width="133" height="26" fill="#66BB6A"/>
      <text class="val v2" x="291" y="132" fill="#eceff1" font-size="12" font-family="sans-serif">50&ndash;100</text>

      <!-- Tournaments -->
      <text x="140" y="170" fill="#cfd8dc" font-size="13" text-anchor="end" font-family="sans-serif">Tournaments</text>
      <rect class="bar b3" x="150" y="156" width="400" height="26" fill="#81C784"/>
      <text class="val v3" x="150" y="174" fill="#0d130d" font-size="12" font-weight="700" dx="8" font-family="sans-serif">100&ndash;300+</text>

      <text class="src" x="150" y="228" fill="#90a4ae" font-size="11" font-family="sans-serif">Sources: Upswing (cash &#8805; 50); PokerNews (MTT &#8805; 100). Leaner live figures are a personal risk choice.</text>
    </svg>
  </div>
</body>
</html>
