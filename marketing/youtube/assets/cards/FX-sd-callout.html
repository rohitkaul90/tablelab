<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif}
  .callout{position:absolute;right:120px;top:230px;width:600px;
    background:rgba(15,22,15,.94);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.55);
    border-left:12px solid #ffd54f;padding:40px 46px;text-align:center}
  .kick{font-size:29px;letter-spacing:.20em;text-transform:uppercase;color:#e6c34d;font-weight:700;margin-bottom:14px}
  .huge{font-size:150px;font-weight:800;color:#ffd54f;line-height:.95;white-space:nowrap}
  .sub{font-size:42px;font-weight:600;color:#e8eee9;margin-top:16px;line-height:1.22}
  .sub b{color:#fff;font-weight:800}
</style></head><body>
  <div class="callout">
    <div class="kick">Per-tournament variance</div>
    <div class="huge">5&ndash;10&times;</div>
    <div class="sub">a comparable<br><b>cash session</b></div>
  </div>
</body></html>
