<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#111811;color:#fff;font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    padding:70px 150px;display:flex;flex-direction:column;align-items:center}
  .accent{color:#4CAF50}
  .kicker{font-size:34px;letter-spacing:.24em;text-transform:uppercase;color:#7fae86;font-weight:700;margin-top:20px}
  .head{font-size:104px;font-weight:800;text-align:center;line-height:1.05;margin-top:24px}
  .sub{font-size:46px;font-weight:600;color:#c8d2c9;text-align:center;margin-top:26px}
  .zones{display:flex;align-items:center;justify-content:center;gap:150px;margin-top:70px}
  .col{display:flex;flex-direction:column;align-items:center}
  .zlabel{font-size:30px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#c8d2c9;margin-bottom:22px}
  .circle{width:250px;height:250px;border-radius:50%;border:5px dashed #4CAF50;
    display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#4CAF50}
  .vbox{width:760px;height:428px;border-radius:18px;border:5px dashed rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center}
  .play{width:120px;height:120px;border-radius:50%;background:#4CAF50;display:flex;align-items:center;justify-content:center}
  .play::after{content:"";border-left:44px solid #111811;border-top:28px solid transparent;border-bottom:28px solid transparent;margin-left:12px}
</style></head><body>
  <div class="kicker">Before you go &mdash;</div>
  <div class="head">Can <span class="accent">AI</span> actually solve poker?</div>
  <div class="sub">AI beat the best players. It wasn&rsquo;t ChatGPT.</div>
  <div class="zones">
    <div class="col"><div class="zlabel">Subscribe</div><div class="circle">SUB</div></div>
    <div class="col"><div class="zlabel">Watch next</div><div class="vbox"><div class="play"></div></div></div>
  </div>
</body></html>
