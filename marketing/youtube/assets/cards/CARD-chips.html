<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}

  .conv{display:flex;justify-content:center;gap:90px;margin-top:70px;font-size:60px;font-weight:700}
  .conv .row{display:flex;align-items:center;gap:26px}
  .conv .stake{color:#c8d2c9;font-weight:600}
  .arrow{color:#7fae86;font-size:52px}
  .cap{font-size:40px;color:#c8d2c9;font-weight:500;margin-top:56px}
  .chips{display:flex;justify-content:center;align-items:flex-end;gap:150px}
  .chipnum{font-size:108px;font-weight:800;color:#4CAF50;margin-top:34px}
