<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#111811;color:#fff;
    font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:120px 150px;text-align:center}
  .accent{color:#4CAF50}
  .kicker{font-size:34px;letter-spacing:.28em;text-transform:uppercase;
          color:#7fae86;font-weight:600;margin-bottom:60px}
  .formula{font-size:120px;font-weight:800;line-height:1;white-space:nowrap;
           font-family:"Cambria Math","Times New Roman",Georgia,serif}
  .formula .e{font-style:italic}
  .formula sup{font-size:.46em;font-weight:700;vertical-align:super;white-space:nowrap}
  .legend{font-size:40px;font-weight:500;color:#c8d2c9;margin-top:96px;line-height:1.4}
  .legend b{color:#fff;font-weight:700}
</style></head><body><div>
  <div class="kicker">Risk of ruin</div>
  <div class="formula"><span>Risk&nbsp;of&nbsp;ruin&nbsp;=&nbsp;</span><span class="e accent">e</span><sup>(&#8722;2&#183;WR&#183;BR&nbsp;/&nbsp;SD&sup2;)</sup></div>
  <div class="legend"><b>WR</b> win rate &#183; <b>BR</b> bankroll &#183; <b>SD</b> std&nbsp;deviation <span style="color:#7fae86">(all in bb)</span></div>
</div></body></html>
