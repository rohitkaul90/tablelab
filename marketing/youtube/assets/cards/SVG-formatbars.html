<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#111811;color:#fff;font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:110px 150px}
  .wrap{width:100%}
  .title{font-size:44px;font-weight:800;margin-bottom:70px;text-align:center}
  .title .accent{color:#4CAF50}
  svg{display:block;width:100%;height:auto}
  .lab{fill:#c8d2c9;font-size:40px;font-weight:600;font-family:"Segoe UI",Arial}
  .val{fill:#fff;font-size:40px;font-weight:800;font-family:"Segoe UI",Arial}
  .src{fill:#7f8f82;font-size:26px;font-weight:500;font-family:"Segoe UI",Arial}
</style></head><body><div class="wrap">
  <div class="title">Typical bankroll by format <span class="accent">(buy-ins)</span></div>
  <svg viewBox="0 0 1720 560" xmlns="http://www.w3.org/2000/svg">
    <line x1="470" y1="20" x2="470" y2="440" stroke="#3a4a3d" stroke-width="3"/>
    <text x="440" y="92" text-anchor="end" class="lab">Live cash</text>
    <rect x="470" y="48" width="150" height="76" rx="8" fill="#4CAF50"/>
    <text x="650" y="98" class="val">20&ndash;50</text>
    <text x="440" y="232" text-anchor="end" class="lab">Online cash</text>
    <rect x="470" y="188" width="300" height="76" rx="8" fill="#66BB6A"/>
    <text x="800" y="238" class="val">50&ndash;100</text>
    <text x="440" y="372" text-anchor="end" class="lab">Tournaments</text>
    <rect x="470" y="328" width="900" height="76" rx="8" fill="#81C784"/>
    <text x="1400" y="378" class="val">100&ndash;300+</text>
    <text x="470" y="510" class="src">Sources: Upswing (cash &#8805; 50) &#183; PokerNews (MTT &#8805; 100). Leaner live figures are a personal risk choice.</text>
  </svg>
</div></body></html>
