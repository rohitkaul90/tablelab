<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{background:#111811;color:#fff;font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:120px 160px;text-align:center}
  .accent{color:#4CAF50}
  .wrap{max-width:1600px;width:100%}
  .kicker{font-size:34px;letter-spacing:.28em;text-transform:uppercase;color:#7fae86;font-weight:600;margin-bottom:50px}
  .huge{font-size:230px;font-weight:800;line-height:.95}
  .big{font-size:104px;font-weight:800;line-height:1.08}
  .conv{display:flex;justify-content:center;gap:90px;margin-top:70px;font-size:60px;font-weight:700}
  .conv .row{display:flex;align-items:center;gap:26px}
  .conv .stake{color:#c8d2c9;font-weight:600}
  .arrow{color:#7fae86;font-size:52px}
  .cap{font-size:40px;color:#c8d2c9;font-weight:500;margin-top:56px}
  .chips{display:flex;justify-content:center;align-items:flex-end;gap:150px}
  .chipnum{font-size:108px;font-weight:800;color:#4CAF50;margin-top:34px}
</style></head><body><div class="wrap"><div class="kicker">The natural unit</div>
<div class="big">Buy-ins are the<br><span class="accent">unit of variance</span></div></div></body></html>
