<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{color:#fff;font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:120px 160px;text-align:center}
  .accent{color:#4CAF50}.wrap{max-width:1600px;width:100%}
  .kicker{font-size:34px;letter-spacing:.28em;text-transform:uppercase;color:#7fae86;font-weight:600;margin-bottom:50px}
  .huge{font-size:230px;font-weight:800;line-height:.95}
  .conv{display:flex;justify-content:center;gap:90px;margin-top:70px;font-size:60px;font-weight:700}
  .conv .row{display:flex;align-items:center;gap:26px}
  .conv .stake{color:#c8d2c9;font-weight:600}
  .arrow{color:#7fae86;font-size:52px}
  .bi{font-size:44px;color:#c8d2c9;font-weight:600}
  .hide{visibility:hidden}
</style></head><body><div class="wrap"><div class="kicker hide">Stop counting in dollars</div><div class="huge accent hide">$8,000</div><div class="conv"><div class="row "><span class="stake">$1/$2</span><span class="arrow">&rarr;</span><span class="accent">40</span><span class="bi">buy-ins</span></div><div class="row hide"><span class="stake">$5/$10</span><span class="arrow">&rarr;</span><span class="accent">8</span><span class="bi">buy-ins</span></div></div></div></body></html>
