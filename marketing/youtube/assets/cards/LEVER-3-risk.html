<!doctype html><html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Segoe UI",-apple-system,system-ui,Arial,sans-serif}
  .pill{position:absolute;right:140px;display:flex;align-items:stretch;
    background:rgba(15,22,15,.92);border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.5);overflow:hidden}
  .bar{width:12px}
  .body{padding:22px 44px 24px 32px}
  .lever{font-size:50px;font-weight:800;color:#fff;white-space:nowrap;line-height:1.05}
  .dir{font-weight:900;margin-right:6px}
  .effect{font-size:38px;font-weight:600;color:#c8d2c9;margin-top:8px;white-space:nowrap}
  .good{color:#4CAF50;font-weight:800}.cost{color:#ffd54f;font-weight:800}
  .pill1{top:150px}.pill2{top:300px}.pill3{top:450px}
  .g .bar{background:#4CAF50}.a .bar{background:#ffd54f}
  .hide{visibility:hidden}
</style></head><body>
  <div class="pill pill1 g hide"><div class="bar"></div><div class="body">
    <div class="lever"><span class="dir good">&#8593;</span>Win rate</div>
    <div class="effect">&rarr; need <span class="good">FEWER</span> buy-ins</div></div></div>
  <div class="pill pill2 a hide"><div class="bar"></div><div class="body">
    <div class="lever"><span class="dir cost">&#8593;</span>Variance (SD)</div>
    <div class="effect">&rarr; need <span class="cost">MORE</span> buy-ins</div></div></div>
  <div class="pill pill3 a "><div class="bar"></div><div class="body">
    <div class="lever"><span class="dir cost">&#8595;</span>Risk you accept</div>
    <div class="effect">&rarr; need <span class="cost">MORE</span> buy-ins</div></div></div>
</body></html>
