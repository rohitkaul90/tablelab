<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body { margin:0; width:2560px; height:1440px; overflow:hidden; }
  body {
    font-family:"Segoe UI Variable Display","Segoe UI",Inter,Arial,sans-serif;
    background:#0b110b;
    position:relative;
  }
  /* depth glows + brand gradient across the full TV-safe canvas */
  .bg {
    position:absolute; inset:0;
    background:
      radial-gradient(1200px 700px at 50% 46%, rgba(76,175,80,.12), rgba(76,175,80,0) 70%),
      radial-gradient(900px 600px at 12% 22%, rgba(41,182,246,.10), rgba(41,182,246,0) 70%),
      radial-gradient(1000px 700px at 88% 82%, rgba(76,175,80,.10), rgba(76,175,80,0) 70%),
      linear-gradient(160deg, #0e150e 0%, #0b110b 55%, #090d09 100%);
  }
  /* faint rising bankroll curve fills the wings (decorative, safe to crop) */
  .curve { position:absolute; inset:0; opacity:.16; }

  /* centered lockup — kept inside YouTube's 1546x423 all-device safe area */
  .safe {
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:1546px; height:423px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
  }
  .identity { display:flex; align-items:center; gap:26px; margin-bottom:30px; }
  .mark { width:104px; height:104px; }
  .word { font-size:78px; font-weight:800; color:#fff; letter-spacing:-1px; }
  .tag  { font-size:62px; font-weight:800; letter-spacing:-1px; line-height:1.05; }
  .tag .w { color:#ffffff; }
  .tag .g { color:#4CAF50; }
  .desc { margin-top:30px; font-size:29px; font-weight:500; color:#9fb0a3; letter-spacing:.2px; }
  .desc .dot { color:#3f5145; padding:0 14px; }
  .desc .url { color:#4CAF50; font-weight:700; }
</style>
</head>
<body>
  <div class="bg"></div>

  <svg class="curve" viewBox="0 0 2560 1440" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#4CAF50" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#4CAF50" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="M0,1180 C300,1120 520,1160 760,1020 C1000,880 1180,940 1420,760 C1660,580 1900,600 2140,420 C2320,285 2460,250 2560,215 L2560,1440 L0,1440 Z" fill="url(#fill)"/>
    <path d="M0,1180 C300,1120 520,1160 760,1020 C1000,880 1180,940 1420,760 C1660,580 1900,600 2140,420 C2320,285 2460,250 2560,215" fill="none" stroke="#4CAF50" stroke-width="4"/>
  </svg>

  <div class="safe">
    <div class="identity">
      <!-- neon poker-table mark inside the brand green rounded square (matches app icon) -->
      <svg class="mark" viewBox="0 0 104 104" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <rect x="1.5" y="1.5" width="101" height="101" rx="26" fill="#0a0f0a" stroke="#2E7D32" stroke-width="3"/>
        <g filter="url(#glow)">
          <rect x="26" y="40" width="52" height="24" rx="12" fill="none" stroke="#33B5FF" stroke-width="3.2"/>
          <circle cx="52" cy="52" r="3.4" fill="#33B5FF"/>
        </g>
      </svg>
      <div class="word">TableLab</div>
    </div>

    <div class="tag"><span class="w">Track your poker. </span><span class="g">Fix your leaks.</span></div>

    <div class="desc">Solver-grounded poker breakdowns<span class="dot">•</span>New video every week<span class="dot">•</span><span class="url">tablelab.app</span></div>
  </div>
</body>
</html>
