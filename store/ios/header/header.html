<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;width:3840px;height:1646px;overflow:hidden;background:#000;}
  body{font-family:'Segoe UI',Roboto,-apple-system,sans-serif;color:#f1f5ee;position:relative;}
  .glow{position:absolute;left:-200px;top:-300px;width:2000px;height:2200px;
        background:radial-gradient(closest-side,rgba(30,120,255,.22),rgba(30,120,255,0) 70%);}
  .glow2{position:absolute;right:-300px;bottom:-700px;width:2200px;height:2000px;
        background:radial-gradient(closest-side,rgba(76,175,80,.16),rgba(76,175,80,0) 70%);}
  .icon{position:absolute;left:260px;top:183px;width:1280px;height:1280px;-webkit-mask-image:radial-gradient(circle at 50% 50%,#000 48%,transparent 66%);mask-image:radial-gradient(circle at 50% 50%,#000 48%,transparent 66%);}
  .text{position:absolute;left:1700px;top:0;height:1646px;display:flex;flex-direction:column;justify-content:center;}
  .brand{font-size:150px;font-weight:600;letter-spacing:-2px;line-height:1;margin-bottom:60px;}
  .brand .q{color:#4a9bff;}
  h1{font-size:230px;font-weight:700;line-height:1.02;margin:0;letter-spacing:-5px;}
  h1 .accent{color:#4CAF50;}
  .sub{font-size:78px;white-space:nowrap;font-weight:400;color:#9fb0a0;margin-top:70px;letter-spacing:0;}
  .pills{display:flex;gap:28px;margin-top:80px;}
  .pill{font-size:60px;font-weight:600;color:#cfe3cf;border:4px solid #2e3b2e;border-radius:60px;padding:18px 48px;}
</style></head>
<body>
  <div class="glow"></div><div class="glow2"></div>
  <img class="icon" src="../../../assets/icon/app_icon.png" alt="">
  <div class="text">
    <div class="brand">Table<span class="q">Lab</span></div>
    <h1>Track your poker.<br><span class="accent">Fix your leaks.</span></h1>
    <div class="sub">Bankroll · hand replays · equity &amp; ICM · AI coaching</div>
    <div class="pills"><span class="pill">Cash</span><span class="pill">Tournaments</span><span class="pill">Free</span></div>
  </div>
</body></html>
