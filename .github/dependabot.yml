# The iOS toolchain gems (fastlane, cocoapods) are pinned by ios/Gemfile.lock and
# there is no Ruby on the Windows dev box to bump them by hand. Dependabot PRs
# are gated by ios-smoke.yml (pubspec/ios paths) — merge when green.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /ios
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - ios
      - dependencies
