name: iOS Simulator Smoke

# No Apple account, certificate or device needed: builds the app unsigned for the
# iOS Simulator, launches it, fires the OAuth deep link at it, and fails if the
# process is no longer alive. Catches the "crashes at launch on iOS" class
# (bad Info.plist key, Podfile/pbxproj mistakes, plugin init throws) that this
# project cannot otherwise see without a Mac.

on:
  pull_request:
    paths:
      - 'ios/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/main.dart'
      - '.github/workflows/ios-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    name: Build + launch on simulator
    runs-on: macos-15
    timeout-minutes: 40
    env:
      FLUTTER_SWIFT_PACKAGE_MANAGER: 'false'
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p lib/config
          cat > lib/config/supabase_config.dart << DART
          class SupabaseConfig {
            static const String url = '${SUPABASE_URL}';
            static const String anonKey = '${SUPABASE_ANON_KEY}';
          }
          DART

      # Same Gemfile-pinned CocoaPods as the release workflow, enforcing the
      # committed lock — otherwise the PR gate resolves pods with the runner's
      # system CocoaPods and can green a lock the tag build then rejects.
      - name: Set up Ruby (cocoapods from ios/Gemfile)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      # Pre-flight for a clear error; the lock itself is checked AFTER the build
      # (Flutter-plugin pod checksums only settle once flutter build has run).
      - name: pod install (pre-flight)
        working-directory: ios
        run: bundle exec pod install

      - name: Build for simulator (unsigned, debug)
        run: flutter build ios --simulator --debug --no-codesign

      - name: Podfile.lock matches the committed lock
        run: |
          if ! git diff --exit-code -- ios/Podfile.lock; then
            echo "::error::ios/Podfile.lock drifted — a plugin change needs new pods: dispatch build-ios.yml with update_pods=true and commit the lock from its artifact"
            exit 1
          fi

      - name: Boot simulator, install, launch, deep-link, assert alive
        run: |
          set -euo pipefail
          # Use an iPhone simulator the runner image already provides (device types
          # alone aren't ordered and old ones have no runtime): newest iOS runtime,
          # highest-numbered iPhone in it.
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devs = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in devs.items():
              if "iOS" not in runtime: continue
              ver = tuple(int(x) for x in re.findall(r"\d+", runtime.rsplit(".", 1)[-1]))
              for d in items:
                  if not d.get("isAvailable") or not d["name"].startswith("iPhone"): continue
                  num = tuple(int(x) for x in re.findall(r"\d+", d["name"])) or (0,)
                  key = (ver, num, "Pro" in d["name"])
                  if best is None or key > best[0]: best = (key, d["udid"], d["name"], runtime)
          if best is None: sys.exit("no available iPhone simulator")
          print(best[1]); print("Simulator:", best[2], best[3], file=sys.stderr)
          ')
          echo "UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" app.tablelab.ios
          sleep 25
          mkdir -p smoke
          xcrun simctl io "$UDID" screenshot smoke/01-launch.png
          # Fire the Supabase OAuth callback scheme at the app. iOS answers an
          # external openurl with its "Open in TableLab?" system prompt (seen in
          # 02-after-deeplink.png), so this proves the scheme is REGISTERED and the
          # app survives the foreground interruption — the in-app app_links handler
          # itself is exercised on a real device in TestFlight QA.
          xcrun simctl openurl "$UDID" "io.supabase.pokertracker://login-callback/#error=smoke"
          sleep 5
          xcrun simctl io "$UDID" screenshot smoke/02-after-deeplink.png
          if ! pgrep -f "Runner.app/Runner" > /dev/null; then
            echo "::error::Runner is no longer running after launch + deep link"
            cp -R ~/Library/Logs/DiagnosticReports smoke/ 2>/dev/null || true
            exit 1
          fi
          # Liveness alone greens a red error screen (main() threw before runApp,
          # a plugin init throwing into the Flutter error handler). The debug engine
          # mirrors Dart exceptions to the unified log, so fail on those too.
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "Runner"' > smoke/runner.log 2>/dev/null || true
          if grep -E "Unhandled Exception|EXCEPTION CAUGHT BY|Error \(Xcode\)|FlutterError" smoke/runner.log; then
            echo "::error::Runner logged a Dart/Flutter exception during launch (see smoke/runner.log)"
            exit 1
          fi
          echo "Runner alive and exception-free after launch + deep link"

      - name: Upload screenshots / crash logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-smoke
          path: smoke/
          if-no-files-found: ignore
