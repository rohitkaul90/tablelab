name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Cloudflare caches /site.css and /site.js for 4h while the HTML is only
      # 600s, so a changed asset keeps serving stale to visitors unless its
      # ?v=<hash> is refreshed. Fails the build if someone edits either file
      # without re-running the script — without this guard the versioning
      # scheme silently rots back into the bug it exists to prevent.
      - name: Check marketing asset versions are current
        run: python3 scripts/version-assets.py --check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p lib/config
          cat > lib/config/supabase_config.dart << DART
          class SupabaseConfig {
            static const String url = '${SUPABASE_URL}';
            static const String anonKey = '${SUPABASE_ANON_KEY}';
          }
          DART

      - name: Flutter analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Flutter test
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage/lcov.info
          retention-days: 7
