name: iOS Secrets Check

# Manual diagnostic for the iOS signing secrets. Prints ONLY pass/fail per
# check — never a secret value, decoded or otherwise. Run it after rotating a
# token or when build-ios.yml's bootstrap/prepare_signing fails before Apple.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - name: Probe secrets (values never printed)
        run: |
          set -u
          fail=0
          ok()   { echo "PASS  $1"; }
          bad()  { echo "FAIL  $1"; fail=1; }

          [ -n "$APPLE_TEAM_ID" ] && [ ${#APPLE_TEAM_ID} -eq 10 ] && ok "APPLE_TEAM_ID is 10 chars" || bad "APPLE_TEAM_ID missing or not 10 chars (len ${#APPLE_TEAM_ID})"
          [ -n "$ASC_KEY_ID" ] && [ ${#ASC_KEY_ID} -eq 10 ] && ok "ASC_KEY_ID is 10 chars" || bad "ASC_KEY_ID missing or not 10 chars (len ${#ASC_KEY_ID})"
          echo "$ASC_ISSUER_ID" | grep -Eq '^[0-9a-f-]{36}$' && ok "ASC_ISSUER_ID looks like a UUID" || bad "ASC_ISSUER_ID is not a 36-char UUID (len ${#ASC_ISSUER_ID})"
          [ ${#MATCH_PASSWORD} -ge 8 ] && ok "MATCH_PASSWORD set (len ${#MATCH_PASSWORD})" || bad "MATCH_PASSWORD missing/short"

          case "$MATCH_GIT_URL" in
            https://github.com/*/*.git) ok "MATCH_GIT_URL is an https github .git URL";;
            *) bad "MATCH_GIT_URL should look like https://github.com/<owner>/<repo>.git (got len ${#MATCH_GIT_URL})";;
          esac

          # The .p8 must decode to a PEM private key.
          if echo "$ASC_KEY_P8_BASE64" | base64 -d 2>/dev/null | grep -q 'BEGIN PRIVATE KEY'; then
            ok "ASC_KEY_P8_BASE64 decodes to a PEM private key"
          else
            bad "ASC_KEY_P8_BASE64 does not decode to a PEM private key (re-run the PowerShell base64 line on the .p8 file)"
          fi

          # The git auth must decode to user:token with a GitHub token shape.
          decoded=$(echo "$MATCH_GIT_BASIC_AUTHORIZATION" | base64 -d 2>/dev/null || true)
          user=${decoded%%:*}
          token=${decoded#*:}
          if [ -z "$decoded" ] || [ "$decoded" = "$user" ]; then
            bad "MATCH_GIT_BASIC_AUTHORIZATION does not decode to user:token"
          else
            ok "MATCH_GIT_BASIC_AUTHORIZATION decodes to user:token (user len ${#user}, token len ${#token})"
            case "$token" in
              github_pat_*) ok "token has the fine-grained PAT prefix";;
              ghp_*)        ok "token has the classic PAT prefix";;
              *)            bad "token does not start with github_pat_ or ghp_ (check for stray spaces/newlines)";;
            esac
            case "$decoded" in
              *$'\n'*|*$'\r'*|*' '*) bad "decoded user:token contains whitespace/newline";;
              *) ok "no whitespace in decoded user:token";;
            esac
          fi

          # Can that token actually read the certs repo? (HTTP status only.)
          repo_path=${MATCH_GIT_URL#https://github.com/}; repo_path=${repo_path%.git}
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" "https://api.github.com/repos/$repo_path")
          [ "$code" = "200" ] && ok "token can read $repo_path via the API" || bad "API read of $repo_path returned HTTP $code (401 = bad token, 404 = token lacks access to this repo)"

          # And does git itself accept it (what match does)?
          if git -c http.extraHeader="Authorization: Basic $MATCH_GIT_BASIC_AUTHORIZATION" ls-remote "$MATCH_GIT_URL" >/dev/null 2>&1; then
            ok "git ls-remote with that auth succeeds"
          else
            bad "git ls-remote with that auth fails (this is exactly what match hit)"
          fi

          exit $fail
