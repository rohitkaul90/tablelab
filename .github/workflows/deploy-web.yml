name: Deploy Web

on:
  push:
    branches: [ main ]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir -p lib/config
          cat > lib/config/supabase_config.dart << DART
          class SupabaseConfig {
            static const String url = '${SUPABASE_URL}';
            static const String anonKey = '${SUPABASE_ANON_KEY}';
          }
          DART

      - name: Build web (release)
        run: flutter build web --release --base-href /

      - name: Preserve CNAME and deploy to docs/
        run: |
          CNAME_CONTENT=$(cat docs/CNAME 2>/dev/null || echo "tablelab.app")
          rm -rf docs/*
          cp -r build/web/. docs/
          echo "$CNAME_CONTENT" > docs/CNAME
          touch docs/.nojekyll

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "No changes to deploy"
            echo "DEPLOYED=0" >> "$GITHUB_ENV"
          else
            git commit -m "Deploy web build [skip ci]"
            git push
            echo "DEPLOYED=1" >> "$GITHUB_ENV"
          fi

      # IndexNow: notify Bing/Yandex/etc. of changed pages after each deploy.
      # Submits every sitemap URL (site is 9 URLs — resubmitting all is within quota
      # and simpler than diffing). Key file lives at web/<key>.txt → served at the root.
      # Non-fatal: never fail the deploy over a ping.
      - name: Ping IndexNow
        if: env.DEPLOYED == '1'
        run: |
          KEY=757770f831bc0fc89f2c1163553715e0
          URLS=$(grep -oP '(?<=<loc>)[^<]+' web/sitemap.xml | jq -R . | jq -s .)
          jq -n --arg key "$KEY" --argjson urls "$URLS" \
            '{host:"tablelab.app", key:$key, keyLocation:("https://tablelab.app/" + $key + ".txt"), urlList:$urls}' \
            | curl -s -o /dev/null -w "IndexNow HTTP %{http_code}\n" \
              -X POST "https://api.indexnow.org/indexnow" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d @- || echo "IndexNow ping failed (non-fatal)"
